# Publishing is triggered by publishing the GitHub release, so the draft release
# created by release.yml is the review step for what reaches PyPI.
#
# Requires a PyPI trusted publisher for this repository and workflow, plus a
# "pypi" environment in the repository settings. Until both exist the job fails
# without uploading anything. See:
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # A release built from the wrong ref would upload the wrong version
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          version="$(./setup.py --version)"
          if [[ "${{ github.event.release.tag_name }}" != "$version" ]]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version $version" >&2
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
