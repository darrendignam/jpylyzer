name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  # Re-enable once the tag-driven run has been verified end to end
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  PYINSTALLER_VERSION: '6.22.3'
  DEBIAN_IMAGE: 'debian:trixie'

jobs:
  metadata:
    name: Package metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read version from package
        id: version
        run: |
          version="$(./setup.py --version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Package version: $version"

      # The Debian build names the .deb after __version__ but dpkg builds it from
      # debian/changelog, so a disagreement only surfaces as a failed copy at the
      # end of a long build
      - name: Check Debian changelog matches package version
        run: |
          changelog_version="$(sed -n '1s/.*(\(.*\)).*/\1/p' debian/changelog)"
          if [[ "$changelog_version" != "${{ steps.version.outputs.version }}" ]]; then
            echo "debian/changelog version $changelog_version does not match package version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      # A tag that disagrees with __version__ would produce a release whose
      # assets are all named after the other version
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "$GITHUB_REF_NAME" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

  python-packages:
    name: Python sdist and wheel
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  debian-package:
    name: Debian package
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build Debian package
        run: ./package-debian-docker.sh "$DEBIAN_IMAGE"

      - name: Verify package contents
        run: |
          deb="$(find dist -name '*.deb' -print -quit)"
          dpkg --info "$deb"
          dpkg --contents "$deb"

      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  windows-binaries:
    name: Windows binaries (${{ matrix.suffix }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: win64
            runner: windows-2025
            architecture: x64
          - suffix: win32
            runner: windows-2025
            architecture: x86
          - suffix: winarm64
            runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.architecture }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade "pyinstaller==$env:PYINSTALLER_VERSION"

      # python and 7z are both on PATH on the GitHub-hosted Windows images
      - name: Build and package
        run: .\package-win.ps1 -Suffix ${{ matrix.suffix }} -Python python -SevenZip 7z

      - name: Verify packaged binary
        run: |
          $zip = Get-ChildItem -Path dist -Filter *.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath verify -Force
          $exe = Join-Path -Path verify -ChildPath 'jpylyzer\jpylyzer.exe'

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0) {
              throw "jpylyzer --version exited with code $LASTEXITCODE"
          }
          Write-Host "$($zip.Name) reports version $version"

          $expectedValidity = [ordered]@{
              'example_files\balloon.jp2'        = 'True'
              'example_files\balloon_trunc1.jp2' = 'False'
          }
          foreach ($file in $expectedValidity.Keys) {
              $report = & $exe $file | Out-String
              $wanted = '<isValid format="jp2">{0}<' -f $expectedValidity[$file]
              if (-not $report.Contains($wanted)) {
                  throw "$file : report does not contain $wanted"
              }
              Write-Host "$file : isValid = $($expectedValidity[$file])"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.suffix }}
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [metadata, python-packages, debian-package, windows-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: ls -lh assets

      # Created as a draft so the release title and description are still
      # written by hand before the release goes public
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber assets/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --prerelease="$PRERELEASE" \
              assets/*
          fi
